%YAML 1.2
---
$id: http://devicetree.org/schemas/net/altr,hssiss.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Altera HSSI subsystem for ethernet

maintainers:
  - Subhransu S. Prusty <subhransu.sekhar.prusty@altera.com>
  - Preetam Narayan <preetam.narayan@altera.com>

description: |
  Altera HSSI SS(subsystem) IP provides connectivity to core ethernet IPs (soft IP
  and hard IP). HSSI subsystem runs a firmware enabling netdev users standardized
  access to core ethernet subsystem. HSSI SS manages the configuration of
  ethernet IPs, while facilitating the data transfer between DMA and core
  through AXI interface.

properties:
  compatible:
    const: altr,hssiss-1.0

  reg:
    description: Address and length of configuration space
    maxItems: 1

  reg-names:
    items:
      - const: sscsr

  reset-mode:
    description: Interface medium to reset the HSSI SS and ethernet core
    enum:
      - reg
      - gpio

  cold-reset:
    type: object
    description: Register used to perform a cold reset of the HSSI SS
    properties:
      ofs:
        description: Offset of the cold-reset register from the HSSI SS CSR base
        $ref: /schemas/types.yaml#/definitions/uint32

      rst-bit:
        description: Bit used to assert the cold reset
        $ref: /schemas/types.yaml#/definitions/uint32

      rst-ack:
        description: Bit indicating cold-reset completion
        $ref: /schemas/types.yaml#/definitions/uint32

    required:
      - ofs
      - rst-bit
      - rst-ack

    additionalProperties: false

required:
  - compatible
  - reg
  - reg-names

additionalProperties: false

examples:
  - |
    hssiss_0_hssiss: hssiss@80000000 {
      compatible = "altr,hssiss-1.0";
      reg-names = "sscsr";
      reg = <0x80000000 0x04000000>;
      reset-mode ="reg";
      cold-reset {
        ofs = <0x100>;
        rst-bit = <0>;
        rst-ack = <1>;
      };
    };
