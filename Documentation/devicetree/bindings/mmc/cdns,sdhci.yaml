%YAML 1.2
---
$id: http://devicetree.org/schemas/mmc/cdns,sdhci.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Cadence SD/SDIO/eMMC Host Controller (SD4HC/SD6HC)

maintainers:
  - Masahiro Yamada <yamada.masahiro@socionext.com>

properties:
  compatible:
    oneOf:
      - description: Cadence SD4HC controller
        items:
          - enum:
              - amd,pensando-elba-sd4hc
              - intel,agilex5-sd4hc
              - microchip,mpfs-sd4hc
              - microchip,pic64gx-sd4hc
              - mobileye,eyeq-sd4hc
              - socionext,uniphier-sd4hc
          - const: cdns,sd4hc
      - description: Cadence SD6HC controller
        oneOf:
          - items:
              - const: altr,agilex5-sd6hc
              - const: cdns,sd6hc
          - const: cdns,sd6hc

  reg:
    minItems: 1
    maxItems: 2

  interrupts:
    maxItems: 1

  clocks:
    minItems: 1
    maxItems: 2

  clock-names:
    minItems: 1
    maxItems: 2

  resets:
    minItems: 1
    maxItems: 3

  reset-names:
    minItems: 1
    maxItems: 3

  iommus:
    maxItems: 1

  dma-coherent: true

  # PHY DLL input delays:
  # They are used to delay the data valid window, and align the window to
  # sampling clock. The delay starts from 5ns (for delay parameter equal to 0)
  # and it is increased by 2.5ns in each step.

  cdns,phy-input-delay-sd-highspeed:
    description: Value of the delay in the input path for SD high-speed timing
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 0x1f

  cdns,phy-input-delay-legacy:
    description: Value of the delay in the input path for legacy timing
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 0x1f

  cdns,phy-input-delay-sd-uhs-sdr12:
    description: Value of the delay in the input path for SD UHS SDR12 timing
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 0x1f

  cdns,phy-input-delay-sd-uhs-sdr25:
    description: Value of the delay in the input path for SD UHS SDR25 timing
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 0x1f

  cdns,phy-input-delay-sd-uhs-sdr50:
    description: Value of the delay in the input path for SD UHS SDR50 timing
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 0x1f

  cdns,phy-input-delay-sd-uhs-ddr50:
    description: Value of the delay in the input path for SD UHS DDR50 timing
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 0x1f

  cdns,phy-input-delay-mmc-highspeed:
    description: Value of the delay in the input path for MMC high-speed timing
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 0x1f

  cdns,phy-input-delay-mmc-ddr:
    description: Value of the delay in the input path for eMMC high-speed DDR timing

  # PHY DLL clock delays:
  # Each delay property represents the fraction of the clock period.
  # The approximate delay value will be
  # (<delay property value>/128)*sdmclk_clock_period.
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 0x1f

  cdns,phy-dll-delay-sdclk:
    description: |
      Value of the delay introduced on the sdclk output for all modes except
      HS200, HS400 and HS400_ES.
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 0x7f

  cdns,phy-dll-delay-sdclk-hsmmc:
    description: |
      Value of the delay introduced on the sdclk output for HS200, HS400 and
      HS400_ES speed modes.
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 0x7f

  cdns,phy-dll-delay-strobe:
    description: |
      Value of the delay introduced on the dat_strobe input used in
      HS400 / HS400_ES speed modes.
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 0x7f

  # SD6HC PHY timing properties:
  cdns,iocell-input-delay:
    description: Input delay across IO cells in picoseconds
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 20000   # 20 ns

  cdns,iocell-output-delay:
    description: Output delay across IO cells in picoseconds
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 20000   # 20 ns

  cdns,delay-element:
    description: Delay element size in picoseconds
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 1
    maximum: 1000



required:
  - compatible
  - reg
  - interrupts
  - clocks

allOf:
  - $ref: sdhci-common.yaml
  - if:
      properties:
        compatible:
          contains:
            const: amd,pensando-elba-sd4hc
    then:
      properties:
        reg:
          items:
            - description: Host controller registers
            - description: Elba byte-lane enable register for writes
      required:
        - resets
    else:
      properties:
        reg:
          maxItems: 1

  - if:
      properties:
        compatible:
          contains:
            const: cdns,sd6hc
    then:
      description: SD6HC variant - use IO-cell and delay element properties
      properties:
        clocks:
          minItems: 2
          maxItems: 2
        clock-names:
          items:
            - const: ciu
            - const: biu
        cdns,phy-input-delay-sd-highspeed: false
        cdns,phy-input-delay-legacy: false
        cdns,phy-input-delay-sd-uhs-sdr12: false
        cdns,phy-input-delay-sd-uhs-sdr25: false
        cdns,phy-input-delay-sd-uhs-sdr50: false
        cdns,phy-input-delay-sd-uhs-ddr50: false
        cdns,phy-input-delay-mmc-highspeed: false
        cdns,phy-input-delay-mmc-ddr: false
        cdns,phy-dll-delay-sdclk: false
        cdns,phy-dll-delay-sdclk-hsmmc: false
        cdns,phy-dll-delay-strobe: false
      required:
        - clock-names

  - if:
      properties:
        compatible:
          contains:
            const: altr,agilex5-sd6hc
    then:
      properties:
        resets:
          minItems: 1
          maxItems: 3
        reset-names:
          oneOf:
            - items:
                - const: sdhc-reset
                - const: combophy
                - const: sdmmc-ocp
            - items:
                - const: sdhc-reset
      required:
        - resets

  - if:
      properties:
        compatible:
          contains:
            const: cdns,sd4hc
    then:
      description: SD4HC variant - use legacy DLL delay properties
      properties:
        resets:
          maxItems: 1
        cdns,iocell-input-delay: false
        cdns,iocell-output-delay: false
        cdns,delay-element: false

unevaluatedProperties: false

examples:
  - |
    emmc: mmc@5a000000 {
        compatible = "socionext,uniphier-sd4hc", "cdns,sd4hc";
        reg = <0x5a000000 0x400>;
        interrupts = <0 78 4>;
        clocks = <&clk 4>;
        bus-width = <8>;
        mmc-ddr-1_8v;
        mmc-hs200-1_8v;
        mmc-hs400-1_8v;
        cdns,phy-dll-delay-sdclk = <0>;
    };
